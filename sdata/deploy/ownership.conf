# Ownership registry for the safe-update deployment system (Slice 1: read-only).
#
# This file is ALWAYS read from the TARGET revision
# (git show <rev>:sdata/deploy/ownership.conf), never from the working
# checkout, so classification is deterministic for any commit. Registry edits
# take effect only once committed.
#
# Rule format (whitespace-separated, `#` starts a comment):
#   <class> <repo-prefix> <home-prefix> [!exclude ...]
#
# class:
#   managed  fork-managed payload: the updater may adopt/deploy it.
#   user     user-managed: the updater never writes here, only reports
#            presence (preserved) or absence. Repo files under such a
#            prefix are install-time seeds, not expected state.
#   sidecar  live copy is user-managed; the updater may only ever deliver
#            a <name>.new alongside it. Dry-run compares live vs blob and
#            reports, never implying deployment.
#
# Matching: longest repo-prefix wins (so an exact-file rule beats its parent
# dir rule regardless of line order). A repo-prefix matches a payload path if
# equal or a `/`-bounded parent. Excludes are relative to repo-prefix; path
# P is excluded when P == E or P == E/* (glob metachars allowed in E).
# Excluded paths are treated as class `user`.
#
# home-prefix must start with `.config/` (resolved against
# $XDG_CONFIG_HOME or $HOME/.config) or `.local/share/` (resolved against
# $XDG_DATA_HOME or $HOME/.local/share). Anything else is a registry error.
#
# Payload files matching NO rule are reported as `unclassified`: that is the
# registry-drift detector (new payload dirs must be classified deliberately,
# dead payload such as kxmlgui5/ stays visible instead of silently ignored).
#
# Two install inputs change the desired payload and are swapped at load time
# (deploy_apply_source_swaps), then recorded in the deployment identity:
# FONTSET_DIR_NAME (--fontset) replaces the fontconfig source with
# dots-extra/fontsets/<name>; INSTALL_VIA_NIX (--via-nix) replaces the
# hypridle.conf source with dots-extra/via-nix/hypridle.conf.

# --- Quickshell (whole-dir managed; highest overwrite risk, see audit) ---
managed dots/.config/quickshell .config/quickshell

# --- Fish: managed except user-owned conf.d and runtime-mutated variables ---
managed dots/.config/fish .config/fish !conf.d
user dots/.config/fish/fish_variables .config/fish/fish_variables

# --- Fontconfig (source may be swapped for a fontset, see below) ---
managed dots/.config/fontconfig .config/fontconfig

# --- Hyprland ---
managed dots/.config/hypr/hyprland .config/hypr/hyprland
# matugen owns this live file (output, see dots/.config/matugen/config.toml);
# the repo copy is an install-time seed. User class keeps the updater from
# replacing live theme output with a stale static placeholder.
user dots/.config/hypr/hyprland/colors.lua .config/hypr/hyprland/colors.lua
managed dots/.config/hypr/hyprland.lua .config/hypr/hyprland.lua
sidecar dots/.config/hypr/hypridle.conf .config/hypr/hypridle.conf
sidecar dots/.config/hypr/hyprlock.conf .config/hypr/hyprlock.conf
user dots/.config/hypr/custom .config/hypr/custom
# hyprlock/ helper scripts ARE referenced by the deployed hyprlock.conf
# (check-capslock.sh and status.sh executed; colors.conf sourced), so the
# scripts are managed payload even though no legacy installer step deploys
# them (installer gap: first updater cutover installs them, not here).
managed dots/.config/hypr/hyprlock .config/hypr/hyprlock
# matugen owns this live file (output, see dots/.config/matugen/config.toml);
# same seed-once treatment as hyprland/colors.lua above.
user dots/.config/hypr/hyprlock/colors.conf .config/hypr/hyprlock/colors.conf

# --- MISC top-levels (explicit: new dirs must be classified deliberately) ---
# NOTE: dolphinrc/kdeglobals are KDE-persisted runtime state (cf. the
# fish_variables precedent below): managed would drift perpetually, so they
# are user-owned seeds. Ditto fuzzel_theme (matugen output).
managed dots/.config/chrome-flags.conf .config/chrome-flags.conf
managed dots/.config/code-flags.conf .config/code-flags.conf
managed dots/.config/darklyrc .config/darklyrc
user dots/.config/dolphinrc .config/dolphinrc
managed dots/.config/foot .config/foot
managed dots/.config/fuzzel .config/fuzzel
user dots/.config/fuzzel/fuzzel_theme.ini .config/fuzzel/fuzzel_theme.ini
managed dots/.config/kde-material-you-colors .config/kde-material-you-colors
user dots/.config/kdeglobals .config/kdeglobals
managed dots/.config/kitty .config/kitty
managed dots/.config/konsolerc .config/konsolerc
managed dots/.config/Kvantum .config/Kvantum
managed dots/.config/matugen .config/matugen
managed dots/.config/mpv .config/mpv
managed dots/.config/starship.toml .config/starship.toml
managed dots/.config/thorium-flags.conf .config/thorium-flags.conf
managed dots/.config/wlogout .config/wlogout
managed dots/.config/xdg-desktop-portal .config/xdg-desktop-portal
managed dots/.config/zshrc.d .config/zshrc.d

# --- Local share payload ---
managed dots/.local/share/icons .local/share/icons
managed dots/.local/share/konsole .local/share/konsole
# kxmlgui5/konsole/sessionui.rc is a static Konsole XMLGUI override shipped in
# repo but covered by no installer step (neither legacy script nor exp YAML
# mention kxmlgui5/); classifying it managed keeps it visible as
# missing-unresolved, and the first updater cutover installs it.
managed dots/.local/share/kxmlgui5 .local/share/kxmlgui5
